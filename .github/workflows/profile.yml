name: Profile checks and release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check Markdown
        run: npx --yes markdownlint-cli2@0.20.0 README.md

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Package profile documentation
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git archive --format=zip --prefix=aegyce-profile/ \
            --output="aegyce-profile-${RELEASE_TAG}.zip" HEAD \
            README.md LICENSE COMMERCIAL-LICENSE.md AGENTS.md
          sha256sum "aegyce-profile-${RELEASE_TAG}.zip" > SHA256SUMS.txt
      - name: Publish documentation release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            "aegyce-profile-${RELEASE_TAG}.zip" SHA256SUMS.txt \
            --verify-tag --title "Aegyce profile ${RELEASE_TAG}" \
            --notes "Profile documentation bundle. This is not an Aegyce software release."
